<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Bookmark Ribbon -->
  <path d="M 22 80 L 22 95 L 28 90 L 34 95 L 34 80 Z" fill="#2563EB" />
  
  <!-- Notebook Outline -->
  <path 
    d="M 52 35 L 52 25 C 52 19.5 47.5 15 42 15 L 20 15 C 14.5 15 10 19.5 10 25 L 10 75 C 10 80.5 14.5 85 20 85 L 42 85 C 47.5 85 52 80.5 52 75 L 52 70" 
    fill="none" 
    stroke="#0B192C" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Horizontal line -->
  <line x1="20" y1="70" x2="42" y2="70" stroke="#0B192C" stroke-width="5" stroke-linecap="round"/>

  <!-- The Green "S" -->
  <path 
    d="M 40 32 C 40 28 36 25 31 25 C 26 25 22 28 22 32 C 22 38 40 38 40 44 C 40 48 36 51 31 51 C 26 51 22 48 22 44" 
    fill="none" 
    stroke="#16A34A" 
    stroke-width="7.5" 
    stroke-linecap="round"
  />

  <!-- Blue Pen -->
  <g transform="translate(60, 48) rotate(15)">
    <!-- Tip -->
    <path d="M -5 15 L 0 28 L 5 15 Z" fill="#60A5FA" stroke="#0B192C" stroke-width="4" stroke-linejoin="round"/>
    <!-- Body -->
    <rect x="-5" y="-20" width="10" height="35" fill="#2563EB" stroke="#0B192C" stroke-width="4" stroke-linejoin="round"/>
    <!-- Clicker -->
    <path d="M -2.5 -20 L -2.5 -26 C -2.5 -28 2.5 -28 2.5 -26 L 2.5 -20" fill="#2563EB" stroke="#0B192C" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
